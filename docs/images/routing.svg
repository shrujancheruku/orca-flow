<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Model routing: small tickets go to Haiku, medium and large tickets to Sonnet, large risky tickets to Opus; checks and merges run on Haiku, the integration review and its fixes on Opus">
  <rect width="1280" height="470" rx="20" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="20" fill="none" stroke="#22304d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="62" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8a9bb8">WHO BUILDS A TICKET</text>

    <!-- baseline -->
    <path d="M56 372 H796" stroke="#22304d" stroke-width="2"/>

    <!-- S -->
    <rect x="72" y="282" width="150" height="90" rx="10" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf"/>
    <text x="147" y="324" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf7">Haiku</text>
    <text x="147" y="348" text-anchor="middle" font-size="13" fill="#2dd4bf">fast and cheap</text>
    <text x="147" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf7">Small</text>
    <text x="147" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.500" fill="#8a9bb8">size:S</text>

    <!-- M -->
    <rect x="262" y="232" width="150" height="140" rx="10" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa"/>
    <text x="337" y="294" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf7">Sonnet</text>
    <text x="337" y="318" text-anchor="middle" font-size="13" fill="#60a5fa">medium effort</text>
    <text x="337" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf7">Medium</text>
    <text x="337" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.500" fill="#8a9bb8">size:M</text>

    <!-- L -->
    <rect x="452" y="182" width="150" height="190" rx="10" fill="#60a5fa" fill-opacity="0.26" stroke="#60a5fa"/>
    <text x="527" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf7">Sonnet</text>
    <text x="527" y="292" text-anchor="middle" font-size="13" fill="#60a5fa">high effort</text>
    <text x="527" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf7">Large</text>
    <text x="527" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.500" fill="#8a9bb8">size:L</text>

    <!-- L + risk -->
    <rect x="642" y="112" width="150" height="260" rx="10" fill="#c4a5ff" fill-opacity="0.18" stroke="#c4a5ff"/>
    <text x="717" y="234" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf7">Opus</text>
    <text x="717" y="258" text-anchor="middle" font-size="13" fill="#c4a5ff">where mistakes cost</text>
    <text x="717" y="404" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf7">Large + risk</text>
    <text x="717" y="426" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.500" fill="#8a9bb8">size:L  risk</text>

    <!-- escalation -->
    <path d="M150 268 C 170 200, 280 190, 322 220" fill="none" stroke="#f5b84a" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>
    <path d="M322 220 l-9 -1 M322 220 l-3 -9" fill="none" stroke="#f5b84a" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="176" font-size="13.500" font-weight="600" fill="#f5b84a">Haiku stuck twice?</text>
    <text x="72" y="196" font-size="13.500" fill="#f5b84a">Sonnet takes the branch.</text>

    <!-- divider -->
    <path d="M852 48 V422" stroke="#22304d" stroke-width="2"/>

    <text x="892" y="62" font-size="13" font-weight="700" letter-spacing="1.6" fill="#8a9bb8">EVERY OTHER JOB</text>

    <g font-size="16">
      <text x="892" y="112" fill="#e6edf7" font-weight="600">Explore the code</text>
      <rect x="1126" y="92" width="98" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf"/>
      <text x="1175" y="111" text-anchor="middle" font-size="13.500" font-weight="700" fill="#2dd4bf">Haiku</text>

      <text x="892" y="164" fill="#e6edf7" font-weight="600">Check against the spec</text>
      <rect x="1126" y="144" width="98" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf"/>
      <text x="1175" y="163" text-anchor="middle" font-size="13.500" font-weight="700" fill="#2dd4bf">Haiku</text>

      <text x="892" y="216" fill="#e6edf7" font-weight="600">Merge a ticket</text>
      <rect x="1126" y="196" width="98" height="28" rx="14" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf"/>
      <text x="1175" y="215" text-anchor="middle" font-size="13.500" font-weight="700" fill="#2dd4bf">Haiku</text>

      <text x="892" y="268" fill="#e6edf7" font-weight="600">Resolve a real conflict</text>
      <rect x="1126" y="248" width="98" height="28" rx="14" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa"/>
      <text x="1175" y="267" text-anchor="middle" font-size="13.500" font-weight="700" fill="#60a5fa">Sonnet</text>

      <text x="892" y="320" fill="#e6edf7" font-weight="600">Review the whole build</text>
      <rect x="1126" y="300" width="98" height="28" rx="14" fill="#c4a5ff" fill-opacity="0.18" stroke="#c4a5ff"/>
      <text x="1175" y="319" text-anchor="middle" font-size="13.500" font-weight="700" fill="#c4a5ff">Opus</text>

      <text x="892" y="372" fill="#e6edf7" font-weight="600">Fix what the review found</text>
      <rect x="1126" y="352" width="98" height="28" rx="14" fill="#c4a5ff" fill-opacity="0.18" stroke="#c4a5ff"/>
      <text x="1175" y="371" text-anchor="middle" font-size="13.500" font-weight="700" fill="#c4a5ff">Opus</text>
    </g>
    <text x="892" y="420" font-size="13.500" fill="#8a9bb8">Every row is yours to change in flow.json.</text>
  </g>
</svg>
