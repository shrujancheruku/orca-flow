<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-label="flow: hand it a spec, get back one pull request">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#38d6f0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#38d6f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#38d6f0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="500" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="500" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="499" rx="20" fill="none" stroke="#22304d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="74" width="194" height="30" rx="15" fill="#38d6f0" fill-opacity="0.12" stroke="#38d6f0" stroke-opacity="0.45"/>
    <text x="169" y="94" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#38d6f0">CLAUDE CODE PLUGIN</text>

    <text x="66" y="218" font-size="120" font-weight="800" letter-spacing="-5" fill="url(#word)">flow</text>

    <text x="72" y="288" font-size="38" font-weight="700" letter-spacing="-0.6" fill="#e6edf7">Hand it a spec.</text>
    <text x="72" y="336" font-size="38" font-weight="700" letter-spacing="-0.6" fill="#e6edf7">Get back one pull request.</text>

    <text x="72" y="392" font-size="18" fill="#8a9bb8">Matt Pocock's skills, run by a fleet of Orca workers,</text>
    <text x="72" y="418" font-size="18" fill="#8a9bb8">each on the cheapest model that can do the job.</text>
  </g>

  <!-- spec -> workers -> one PR -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M770 250 C 810 250, 810 132, 860 132" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <path d="M770 250 C 810 250, 820 211, 860 211" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <path d="M770 250 C 810 250, 820 290, 860 290" stroke="#60a5fa" stroke-opacity="0.7"/>
    <path d="M770 250 C 810 250, 810 369, 860 369" stroke="#c4a5ff" stroke-opacity="0.7"/>
    <path d="M1040 132 C 1090 132, 1090 250, 1132 250" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <path d="M1040 211 C 1085 211, 1090 250, 1132 250" stroke="#2dd4bf" stroke-opacity="0.7"/>
    <path d="M1040 290 C 1085 290, 1090 250, 1132 250" stroke="#60a5fa" stroke-opacity="0.7"/>
    <path d="M1040 369 C 1090 369, 1090 250, 1132 250" stroke="#c4a5ff" stroke-opacity="0.7"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- spec card -->
    <rect x="690" y="204" width="80" height="92" rx="10" fill="#0f1829" stroke="#3b4d73"/>
    <rect x="704" y="222" width="40" height="5" rx="2.5" fill="#e6edf7"/>
    <rect x="704" y="238" width="52" height="4" rx="2" fill="#4a5d85"/>
    <rect x="704" y="250" width="46" height="4" rx="2" fill="#4a5d85"/>
    <rect x="704" y="262" width="52" height="4" rx="2" fill="#4a5d85"/>
    <rect x="704" y="274" width="30" height="4" rx="2" fill="#4a5d85"/>
    <text x="730" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#8a9bb8">your spec</text>

    <!-- workers -->
    <g font-size="14" font-weight="600">
      <rect x="860" y="112" width="180" height="40" rx="20" fill="#0f1829" stroke="#2dd4bf"/>
      <circle cx="882" cy="132" r="5" fill="#2dd4bf"/>
      <text x="898" y="137" fill="#e6edf7">#43 · build · haiku</text>

      <rect x="860" y="191" width="180" height="40" rx="20" fill="#0f1829" stroke="#2dd4bf"/>
      <circle cx="882" cy="211" r="5" fill="#2dd4bf"/>
      <text x="898" y="216" fill="#e6edf7">#45 · check · haiku</text>

      <rect x="860" y="270" width="180" height="40" rx="20" fill="#0f1829" stroke="#60a5fa"/>
      <circle cx="882" cy="290" r="5" fill="#60a5fa"/>
      <text x="898" y="295" fill="#e6edf7">#47 · build · sonnet</text>

      <rect x="860" y="349" width="180" height="40" rx="20" fill="#0f1829" stroke="#c4a5ff"/>
      <circle cx="882" cy="369" r="5" fill="#c4a5ff"/>
      <text x="898" y="374" fill="#e6edf7">#51 · build · opus</text>
    </g>
    <text x="950" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#8a9bb8">parallel workers</text>

    <!-- one PR -->
    <circle cx="1170" cy="250" r="38" fill="#4ade80" fill-opacity="0.12" stroke="#4ade80" stroke-width="2"/>
    <g fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1157" cy="236" r="5"/>
      <circle cx="1157" cy="264" r="5"/>
      <circle cx="1183" cy="264" r="5"/>
      <path d="M1157 241 V259"/>
      <path d="M1164 236 H1175 a8 8 0 0 1 8 8 V259"/>
    </g>
    <text x="1170" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#8a9bb8">one PR, yours to merge</text>
  </g>
</svg>
